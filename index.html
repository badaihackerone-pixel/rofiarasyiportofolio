<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid B-612 // Rofi Arasyi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute;z-index:-1;">
        <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="paper-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="5" result="noise" />
            <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.98 0 0 0  0 0.94 0 0 0  0 0 0 0.3 0" in="noise" result="coloredNoise" />
            <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
        </filter>
    </svg>

    <div id="space-view" class="view active">
        <div id="stars-layer-1" class="starfield"></div>
        <div id="stars-layer-2" class="starfield"></div>
        <div id="stars-layer-3" class="starfield"></div>
        
        <div class="planet p-float-1" id="p-home" style="top: 15%; left: 15%;" data-id="page-home">
            <div class="crater c1"></div><div class="crater c2"></div>
            <div class="rose-container">
                <div class="glass-dome"></div>
                <div class="rose-flower"></div>
            </div>
            <span class="label">Asteroid B-612</span>
            <div class="atmosphere-glow"></div>
        </div>
        
        <div class="planet p-float-2" id="p-bounty" style="top: 65%; left: 20%;" data-id="page-bounty">
            <div class="css-crown"></div>
            <span class="label">The King</span>
            <div class="atmosphere-glow"></div>
        </div>
        
        <div class="planet p-float-3" id="p-medfo" style="top: 20%; left: 75%;" data-id="page-medfo">
            <div class="css-lamp">
                <div class="lamp-head"></div>
                <div class="lamp-post"></div>
                <div class="lamp-light"></div>
            </div>
            <span class="label">Lamplighter</span>
            <div class="atmosphere-glow"></div>
        </div>

        <div class="planet p-float-1" id="p-contact" style="top: 70%; left: 70%;" data-id="page-contact">
            <div class="css-fox">
                <div class="fox-ear left"></div>
                <div class="fox-ear right"></div>
                <div class="fox-face"></div>
            </div>
            <span class="label">The Fox</span>
            <div class="atmosphere-glow"></div>
        </div>
    </div>

    <div id="surface-view" class="view">
        <div id="sky"></div>
        <div id="stars-surface" class="starfield" style="opacity: 0.3;"></div>
        
        <div id="clouds-container">
            <div class="cloud" style="top: 8%; width: 150px; height: 35px; animation-duration: 45s; opacity: 0.8;"></div>
            <div class="cloud" style="top: 25%; width: 220px; height: 50px; animation-duration: 60s; animation-delay: -15s; opacity: 0.6;"></div>
            <div class="cloud" style="top: 15%; width: 110px; height: 25px; animation-duration: 35s; animation-delay: -5s; opacity: 0.7;"></div>
            <div class="cloud" style="top: 35%; width: 180px; height: 40px; animation-duration: 50s; animation-delay: -25s; opacity: 0.5;"></div>
            <div class="cloud" style="top: 5%; width: 250px; height: 60px; animation-duration: 70s; animation-delay: -40s; opacity: 0.4;"></div>
        </div>

        <div id="ground">
            <div class="dune d1"></div>
            <div class="dune d2"></div>
            <div class="dune d3"></div>
        </div>
        
        <button id="btn-emergency-exit" onclick="takeOffToSpace()">[ESC] Lepas Landas</button>

        <div id="content-container"></div>
        <div id="escape-hint">↑ Terbang menembus batas langit untuk kembali ↑</div>
    </div>

    <div id="player">
        <svg viewBox="0 0 100 100" width="60" height="60">
            <g filter="drop-shadow(2px 5px 3px rgba(0,0,0,0.5))">
                <rect x="15" y="32" width="70" height="6" rx="3" fill="#f1c40f"/>
                <path d="M30 32 L70 32 L75 68 L50 85 L25 68 Z" fill="#c0392b"/>
                <rect x="20" y="58" width="60" height="6" rx="3" fill="#f1c40f"/>
                <path d="M45 32 L50 20 L55 32 Z" fill="#e67e22"/>
                <circle cx="50" cy="50" r="12" fill="#2c3e50"/>
                <path d="M40 50 Q50 40 60 50" stroke="#ecf0f1" stroke-width="2" fill="none" opacity="0.5"/>
                <ellipse cx="50" cy="12" rx="35" ry="4" fill="#ecf0f1" opacity="0.8"/>
            </g>
        </svg>
    </div>

    <template id="page-home">
        <div class="layout-split">
            <div class="text-content">
                <h1>Asteroid B-612</h1>
                <p class="quote">"Sesuatu yang penting tidak bisa dilihat oleh mata, melainkan oleh hati."</p>
                <div class="narrative-text">
                    <p>Saya adalah Mahasiswa Program Studi Teknik Elektro di FMIPA Universitas Padjadjaran. Fokus saya terletak pada persimpangan antara rekayasa perangkat keras dan keamanan sistem logikal. Saya memadukan pemahaman mendalam tentang sirkuit dan sistem digital dengan analisis keamanan tingkat tinggi, mencari anomali di tempat yang tidak diperhatikan oleh sistem terotomatisasi.</p>
                </div>
                <div class="data-block">
                    <p><strong>Nama:</strong> Rofi Arasyi</p>
                    <p><strong>Tanggal Lahir:</strong> 8 Januari 2007</p>
                    <p><strong>Domisili:</strong> Cakung, Jakarta Timur</p>
                    <p><strong>Pendidikan:</strong> Teknik Elektro, FMIPA UNPAD</p>
                    <p><strong>NPM:</strong> 140910250067</p>
                </div>
            </div>
            <div class="photo-frame">
                <div class="photo-inner">
                    <img src="assets/foto.jpg" alt="Rofi Arasyi" onerror="this.style.display='none'">
                    <div class="css-photo-placeholder"></div>
                </div>
                <div class="photo-caption">Rofi Arasyi</div>
            </div>
        </div>
    </template>

    <template id="page-bounty">
        <h1>The King</h1>
        <div class="narrative-text">
            <p>Di luar kehidupan akademik, saya aktif melakukan praktik <em>Freelance Bug Bounty</em>. Sebagai peneliti keamanan independen (Bug Hunter), saya bertanggung jawab untuk menemukan, mengeksploitasi, dan melaporkan kerentanan kritis pada infrastruktur perusahaan berskala global sebelum celah tersebut dimanfaatkan oleh pihak yang tidak bertanggung jawab.</p>
        </div>
        <div class="grid-layout">
            <div class="data-block p-critical">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge red">P1</span>
                </div>
                <p class="bounty-reward">$3,000</p>
                <p class="status-text">Status: Unresolved</p>
            </div>
            <div class="data-block p-high">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge orange">P2</span>
                </div>
                <p class="bounty-reward">$1,200</p>
                <p class="status-text">Status: Resolved</p>
            </div>
            <div class="data-block p-medium">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge yellow">P4</span>
                </div>
                <p class="bounty-reward">$150</p>
                <p class="status-text">Status: Unresolved</p>
            </div>
        </div>
    </template>

    <template id="page-medfo">
        <h1>Cahaya Pemantik</h1>
        <div class="narrative-text">
            <p>Saya juga bergabung pada Himpunan Mahasiswa Teknik Elektro (HMTE) sebagai Staf Departemen Media dan Informasi (Medfo). Peran saya melibatkan perancangan strategi komunikasi visual, manajemen aset digital, dan pemeliharaan jalur informasi agar aktivitas himpunan dapat terdistribusi dengan baik ke seluruh pemangku kepentingan.</p>
        </div>
        <div class="ig-gallery-grid">
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DXqywCLEk7b/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DW34wLymD07/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DWyXcHfmLI4/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DV3Cp7Ckm78/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
        </div>
    </template>

    <template id="page-contact">
        <h1>The Fox</h1>
        <p class="quote">"Kamu menjadi bertanggung jawab selamanya atas apa yang telah kamu jinakkan."</p>
        <div class="data-block contact-block">
            <ul class="contact-list">
                <li>
                    <span class="icon-css ig-icon"></span>
                    <a href="https://instagram.com/rofiarasyi" target="_blank">@rofiarasyi</a>
                </li>
                <li>
                    <span class="icon-css ln-icon"></span>
                    <a href="https://www.linkedin.com/in/rofiarasyi/" target="_blank">Rofi Arasyi</a>
                </li>
                <li>
                    <span class="icon-css gh-icon"></span>
                    <a href="https://github.com/badaihackerone-pixel" target="_blank">badaihackerone-pixel</a>
                </li>
                <li>
                    <span class="icon-css bc-icon"></span>
                    <a href="https://bugcrowd.com/h/Badai" target="_blank">Badai</a>
                </li>
            </ul>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
