<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who's Rofi? — Rofi Arasyi</title>
<meta name="description" content="Rofi Arasyi's rented room. Click around to meet a security researcher who also does visual design, Electrical Engineering at Unpad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ---------- token ---------- */
:root{
  --bg:#EEF1F3;          /* kertas biru-abu, pagi */
  --ink:#1D2530;
  --muted:#5B6470;
  --line:rgba(29,37,48,.12);
  --panel:#FFFFFF;
  --accent:#F2B23C;      /* cahaya lampu belajar = petunjuk */
  --accent-ink:#6B4600;
  --found:#3E9B6B;
  /* preset font: judul / teks / label. Ganti tiga baris ini kalau mau coba pasangan lain */
  --serif:"Pixelify Sans",system-ui,sans-serif;   /* judul & nama benda (nama variabel dipertahankan) */
  --sans:"VT323",ui-monospace,monospace;           /* teks isi, font pixel yang masih enak dibaca */
  --mono:"Pixelify Sans",ui-monospace,monospace;   /* label, penghitung, laporan */
}
body.night{
  --bg:#141A21;
  --ink:#E9ECEF;
  --muted:#9AA4B0;
  --line:rgba(233,236,239,.14);
  --panel:#1C232C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:19px;line-height:1.35;
  transition:background .6s ease,color .6s ease;
  overflow-x:hidden;
}
a{color:inherit}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.serif{font-family:var(--serif)}

/* ---------- header ---------- */
header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:22px 28px 0;max-width:1180px;margin:0 auto;
}
.brand h1{
  font-family:var(--serif);font-weight:700;font-style:normal;letter-spacing:0;
  font-size:clamp(28px,4vw,40px);line-height:1.05;margin:2px 0 6px;letter-spacing:-.01em;
}
.brand .sub{margin:0;color:var(--muted);font-size:18px}
.brand .mono{color:var(--muted)}
.hud{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:6px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:block;transition:all .3s}
.dots i.on{background:var(--found);border-color:var(--found)}
#count{color:var(--muted);transition:color .3s}
#count.done{color:var(--found)}

/* ---------- stage ---------- */
main{max-width:1180px;margin:0 auto;padding:6px 16px 120px}
#stage{position:relative;width:100%;max-width:820px;margin:0 auto}
#room{width:100%;height:auto;display:block;overflow:visible}
.scene{transition:filter .8s ease}
body.night .scene{filter:brightness(.52) saturate(.8)}
body.gelap .scene{filter:brightness(.3) saturate(.7)}
.swOff{opacity:0}
body.gelap .swOn{opacity:0}
body.gelap .swOff{opacity:1}
.spark{opacity:0}
@keyframes zapk{0%,100%{opacity:0}30%{opacity:1}60%{opacity:0}80%{opacity:1}}
.zap .spark{animation:zapk .5s steps(1,end)}
.night-only{opacity:0;transition:opacity .8s}
body.night .night-only{opacity:1}

.obj{cursor:pointer;outline:none;transition:filter .2s;pointer-events:visiblePainted}
.obj [fill="none"]{pointer-events:stroke}
.obj:hover{filter:brightness(1.05) drop-shadow(0 2px 3px rgba(0,0,0,.14))}
.obj:focus-visible{filter:drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 1px var(--accent))}

/* penanda petunjuk */
.mk{pointer-events:none}
.mk .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.7;transform-box:fill-box;transform-origin:center}
.mk .dot{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.jk .jv{opacity:0;transition:opacity .3s}
.jk[data-view="0"] .jv0,.jk[data-view="1"] .jv1,.jk[data-view="2"] .jv2,.jk[data-view="3"] .jv3{opacity:1}
.jadwal{width:100%;border-collapse:collapse;font-size:17px;margin:8px 0 12px}
.jadwal td{padding:7px 6px;border-top:2px solid var(--line);vertical-align:top}
.jadwal td:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:64px}
.jadwal tr.today td{background:rgba(242,178,60,.14)}
.photo{width:132px;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:8px;margin:4px 0 12px}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.mk .tick{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mk.found .ring{opacity:0;animation:none}
.mk.found .dot{fill:var(--found)}
.mk.found .tick{opacity:1}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:no-preference){.mk .ring{animation:pulse 1.8s ease-out infinite}}

/* kipas & kucing */
.gY{opacity:.28}
@keyframes oscA{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes oscB{0%,100%{opacity:.28}50%{opacity:1}}
.spin .gX{animation:oscA 5s ease-in-out infinite}
.spin .gY{animation:oscB 5s ease-in-out infinite}
.wind line{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes gust{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(26px,15px);opacity:0}}
.spin .wind line{animation:gust 1.5s linear infinite}
.fanled{fill:#8F8B84}.spin .fanled{fill:#F2B23C}
#cat .pawup,#cat .pawdown-r{transition:opacity .15s}
#cat .pawdown-r{opacity:0}
#cat.salute .pawdown-r{opacity:1}
#cat.salute .pawup{opacity:0}
@media (prefers-reduced-motion:reduce){.spin .gY,.spin .gX,.spin .wind line{animation:none}}

/* animasi klik per benda */
.obj{transform-box:fill-box;transform-origin:50% 50%}
@keyframes a-knock{0%,100%{transform:none}20%{transform:scale(.985)}40%{transform:none}60%{transform:scale(.985)}}
@keyframes a-flash{0%,100%{filter:brightness(1)}30%{filter:brightness(1.7)}}
@keyframes a-wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(2.5deg)}75%{transform:rotate(-2deg)}}
@keyframes a-swing{0%{transform:rotate(0)}20%{transform:rotate(7deg)}50%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}100%{transform:rotate(0)}}
@keyframes a-tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}65%{transform:rotate(2deg)}}
@keyframes a-tug{0%,100%{transform:scale(1)}40%{transform:scale(1.02,.95)}70%{transform:scale(.99,1.02)}}
@keyframes a-lid{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
@keyframes a-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1.5px)}80%{transform:translateX(1.5px)}}
@keyframes a-flicker{0%,100%{opacity:1}20%{opacity:.35}35%{opacity:1}55%{opacity:.6}70%{opacity:1}}
@keyframes a-rattle{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1.5px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes a-jitter{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}75%{transform:translateX(-1px)}}
@keyframes a-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}55%{transform:translateY(0)}75%{transform:translateY(-2px)}}
@keyframes a-sink{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.955)}70%{transform:scaleY(1.01)}}
@keyframes a-strum{0%,100%{transform:rotate(0)}20%{transform:rotate(1.5deg)}40%{transform:rotate(-1.5deg)}60%{transform:rotate(1deg)}80%{transform:rotate(-1deg)}}
@keyframes a-rock{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
@keyframes a-pop{0%,100%{transform:scale(1)}30%{transform:scale(1.04)}}
@keyframes a-flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
@keyframes a-clink{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg) translateY(-1px)}60%{transform:rotate(3deg)}}
@keyframes a-tick{0%,100%{transform:rotate(0)}30%{transform:rotate(2.5deg)}60%{transform:rotate(-2.5deg)}}
@keyframes a-smoke{0%{opacity:.75;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-16px) scale(1.15)}}
.an-clink{transform-origin:50% 100%;animation:a-clink .5s ease}
.an-tick{animation:a-tick .6s ease}
.smoke{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.puff .smoke{animation:a-smoke 1.7s ease-out}
@keyframes a-cetek{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes a-zap{0%,100%{filter:brightness(1)}30%{filter:brightness(2.2)}}
.an-cetek{animation:a-cetek .25s steps(2)}
.an-zap{animation:a-zap .5s steps(3)}
@keyframes a-locked{0%,100%{transform:translateX(0)}15%{transform:translateX(-1.5px)}30%{transform:translateX(1.5px)}45%{transform:translateX(-1px)}60%{transform:translateX(1px)}}
.an-knock{animation:a-knock .5s ease}
.an-flash{animation:a-flash .6s ease}
.an-wobble{transform-origin:50% 0%;animation:a-wobble .7s ease}
.an-swing{transform-origin:50% 0%;animation:a-swing 1.2s ease}
.an-tilt{transform-origin:50% 0%;animation:a-tilt .8s ease}
.an-tug{animation:a-tug .6s ease}
.an-lid{transform-origin:50% 100%;animation:a-lid .7s ease}
.an-shake{animation:a-shake .4s ease}
.an-flicker{animation:a-flicker .6s steps(1,end)}
.an-rattle{animation:a-rattle .35s ease 2}
.an-jitter{animation:a-jitter .25s ease 2}
.an-bounce{animation:a-bounce .7s cubic-bezier(.3,1.4,.5,1)}
.an-sink{transform-origin:50% 100%;animation:a-sink .6s ease}
.an-strum{transform-origin:50% 100%;animation:a-strum .5s ease}
.playing{transform-origin:50% 100%;animation:a-strum .5s ease infinite}
.an-rock{transform-origin:50% 100%;animation:a-rock .7s ease}
.an-pop{transform-origin:50% 100%;animation:a-pop .4s ease}
.an-flip{animation:a-flip .35s ease}
.an-locked{animation:a-locked .35s ease}
@media (prefers-reduced-motion:reduce){[class*="an-"]{animation:none!important}}
#mute{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#mute:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- gaya blocky untuk seluruh UI ---------- */
*,*::before,*::after{border-radius:0!important}
.hud .dots i{width:11px;height:11px;border:2px solid var(--muted)}
.dots i.on{background:var(--found);border-color:var(--found)}
#mute{border:2px solid var(--ink);color:var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 10px 3px;transition:transform .1s steps(2),box-shadow .1s steps(2)}
#mute:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
#mute:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.mk .ring{transform-box:fill-box;transform-origin:center}
.thumbs figure,.photo{border:2px dashed var(--muted)}
.cover{box-shadow:4px 4px 0 rgba(0,0,0,.28);border:2px solid rgba(0,0,0,.25)}
.redact{height:.75em}

/* ---------- gelembung kucing ---------- */
#bubble{
  position:fixed;left:24px;bottom:28px;max-width:360px;
  background:var(--panel);border:2px solid var(--ink);
  padding:12px 16px 10px;box-shadow:5px 5px 0 var(--ink);
  transition:transform .3s,opacity .3s,background .6s;z-index:5;
}
#bubble::before{content:'';position:absolute;left:18px;bottom:-9px;width:9px;height:9px;background:var(--panel);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
#bubble::after{content:'';position:absolute;left:14px;bottom:-16px;width:7px;height:7px;background:var(--panel);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
#bubble .mono{color:var(--muted);display:block;margin-bottom:2px}
#bubble p{margin:0;font-size:19px;line-height:1.3}

/* ---------- panel petunjuk ---------- */
#backdrop{position:fixed;inset:0;background:rgba(20,26,33,.28);opacity:0;pointer-events:none;transition:opacity .2s steps(3);z-index:8}
#backdrop.on{opacity:1;pointer-events:auto}
#panel{
  position:fixed;top:0;right:0;height:100%;width:min(420px,100%);
  background:var(--panel);border-left:3px solid var(--ink);
  transform:translateX(102%);transition:transform .3s steps(6),background .6s;
  z-index:9;overflow-y:auto;padding:28px 28px 40px;
}
#panel.on{transform:translateX(0)}
#panel .close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;
  border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px;box-shadow:3px 3px 0 var(--ink);
}
#panel .close:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
#panel .tag{color:var(--accent-ink);background:var(--accent);display:inline-block;padding:4px 8px 2px;border:2px solid var(--accent-ink)}
body.night #panel .tag{color:var(--accent)}
#panel h2{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.15;margin:14px 0 12px}
#panel p{margin:0 0 12px;color:var(--ink)}
#panel .muted{color:var(--muted)}
#panel .report{border:2px solid var(--ink);padding:12px 14px;margin:14px 0;font-family:var(--mono);font-size:12px;line-height:1.9;color:var(--muted);box-shadow:4px 4px 0 var(--ink)}
#panel .report b{color:var(--ink);font-weight:500}
.redact{display:inline-block;height:.85em;width:6ch;background:var(--ink);border-radius:2px;vertical-align:-1px;opacity:.85}
.redact.s{width:3.5ch}.redact.l{width:9ch}
#panel .links{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
#panel .links a{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  text-decoration:none;border:2px solid var(--ink);padding:10px 12px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s steps(2),box-shadow .1s steps(2)
}
#panel .links a:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
#panel .links .mono{color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.thumbs figure{margin:0;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center;padding:6px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:7px}
#panel .cat{margin:16px 0 4px}
.covers{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.cover{width:74px;aspect-ratio:2/3;border-radius:3px;padding:8px 7px;color:#F4F1EA;font-size:10px;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset -3px 0 0 rgba(0,0,0,.18)}
.cover b{font-family:var(--serif);font-size:12px;font-weight:600}
.cover span{opacity:.85}
#panel .cat svg{width:80px;height:80px;image-rendering:pixelated}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px 8px;font-size:18px;border:2px solid var(--bg);box-shadow:4px 4px 0 var(--muted);
  transition:all .2s steps(4);pointer-events:none;z-index:10
}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- mobile ---------- */
@media (max-width:640px){
  header{flex-direction:column;padding:18px 18px 0}
  .hud{flex-direction:row;align-items:center;gap:12px;padding-top:0}
  main{padding-bottom:150px}
  #bubble{left:12px;right:12px;max-width:none;bottom:12px}
  #panel{top:auto;bottom:0;height:min(78vh,720px);width:100%;border-left:0;border-top:3px solid var(--ink);
    transform:translateY(105%);padding:22px 20px 40px}
  #panel.on{transform:translateY(0)}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mono">rofi arasyi · portfolio</span>
    <h1>This is my room.</h1>
    <p class="sub">Click stuff. Four things in here say something about me.</p>
  </div>
  <div class="hud" aria-live="polite">
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <span id="count" class="mono">Found 0/4</span>
  </div>
</header>

<main>
  <div id="stage">
    <svg id="room" viewBox="0 0 760 700" role="img" aria-label="Rofi's rented room, isometric view. Things inside can be clicked."></svg>
  </div>
</main>

<div id="bubble" role="status">
  <span class="mono">Cat</span>
  <p id="bubbleText">Hi. Four things in here are worth a click. Start with whatever's blinking.</p>
</div>

<div id="backdrop"></div>
<aside id="panel" aria-hidden="true">
  <button class="close" aria-label="Close">✕</button>
  <div id="panelBody"></div>
</aside>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   1) PROYEKSI ISOMETRIK
   Titik (x,y,z) di dunia kamar (satuan ~ 30 cm) → koordinat layar.
   Persis prinsip plugin isometrik di Figma: tiga bidang, tiga gradasi,
   ditambah garis tepi, gradasi halus, dan bayangan supaya lebih "3D".
   ===================================================================== */
const U=36, OX=380, OY=354, C30=0.8660254;
const P=(x,y,z)=>[OX+(x-y)*C30*U, OY+(x+y)*0.5*U-z*U];
const pts=a=>a.map(p=>P(...p).map(n=>n.toFixed(1)).join(',')).join(' ');
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,a=Math.abs(amt);
  r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
const poly=(a,fill,extra='')=>`<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
const EDGE=c=>`stroke="${shade(c,-.55)}" stroke-opacity=".5" stroke-width=".7" stroke-linejoin="round"`;
/* kotak = bidang atas (terang), kiri (sedang), kanan (gelap) + gradasi + tepi */
function box(x,y,z,w,d,h,c){
  const top=[[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]];
  const left=[[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]];
  const right=[[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]];
  const e=EDGE(c);
  return poly(left,c,e)+poly(left,'url(#gv)')+poly(right,shade(c,-.32),e)+poly(right,'url(#gv)')+poly(top,shade(c,.28),e)+poly(top,'url(#gt)');
}
/* bayangan lembut di lantai (cahaya dari kiri-atas) */
const sh=(x,y,w,d,h)=>{const xr=Math.min(x+w+.32*h,W),yr=Math.min(y+d+.12*h,D);return poly([[x+.05,y+.05,.005],[xr,y+.05,.005],[xr,yr,.005],[x+.05,yr,.005]],'rgba(70,52,30,.13)','pointer-events="none"');};
/* bidang di dinding kiri (x=0) dan dinding kanan (y=0) */
const onLeft=(y1,y2,z1,z2,fill,extra='')=>poly([[0.02,y1,z1],[0.02,y2,z1],[0.02,y2,z2],[0.02,y1,z2]],fill,extra);
const onRight=(x1,x2,z1,z2,fill,extra='')=>poly([[x1,0.02,z1],[x2,0.02,z1],[x2,0.02,z2],[x1,0.02,z2]],fill,extra);
const flat=(x,y,w,d,fill,extra='')=>poly([[x,y,0.01],[x+w,y,0.01],[x+w,y+d,0.01],[x,y+d,0.01]],fill,extra);
/* silinder tegak: badan + tutup atas (rice cooker, panci, kaleng, tempat sampah) */
function cyl(x,y,z,r,h,c){
  const [cx,cb]=P(x,y,z),[,ct]=P(x,y,z+h);const rx=r*C30*U*1.41421,ry=r*0.5*U*1.41421;
  const body=`<path d="M${(cx-rx).toFixed(1)} ${ct.toFixed(1)}V${cb.toFixed(1)}A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(cx+rx).toFixed(1)} ${cb.toFixed(1)}V${ct.toFixed(1)}Z" fill="${c}" ${EDGE(c)}/>`;
  const grad=`<path d="M${(cx-rx).toFixed(1)} ${ct.toFixed(1)}V${cb.toFixed(1)}A${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(cx+rx).toFixed(1)} ${cb.toFixed(1)}V${ct.toFixed(1)}Z" fill="url(#gh)"/>`;

  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.012);gn.gain.exponentialRampToValueAtTime(.0001,t+d);

/* ---- pemutar melodi untuk gitar ----
   Format: [nada, panjang dalam ketukan, (opsional) nada bass]. '-' = jeda.
   Ganti isi MELODI dengan nada apa pun yang kamu mau; nama nada: C4, D#4, A3, dst. */
const MELODI={bpm:104,notes:[
  ['E4',1,'E2'],['G4',1],['A4',1.5],['G4',.5],['E4',1],['D4',1],['E4',2],
  ['E4',1,'E2'],['G4',1],['A4',1.5],['B4',.5],['A4',1],['G4',1],['E4',2],
  ['G4',1,'G2'],['A4',1],['B4',1.5],['A4',.5],['G4',1],['E4',1],['D4',2],
  ['E4',1,'D2'],['D4',1],['B3',1.5],['D4',.5],['E4',1],['G4',1],['E4',3],
  ['-',1],
  ['B4',1,'E2'],['A4',1],['G4',1.5],['A4',.5],['B4',1],['D5',1],['B4',2],
  ['A4',1,'C3'],['G4',1],['E4',1.5],['G4',.5],['A4',1],['G4',1],['E4',2],
  ['G4',1,'G2'],['E4',1],['D4',1.5],['E4',.5],['G4',1],['A4',1],['B4',2],
  ['A4',1,'D2'],['G4',1],['E4',1.5],['D4',.5],['E4',3,'E2']
]};
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
const freqOf=n=>{const m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]-4)*12-9)/12);};
let melodyTimers=[],melodyOn=false;
function stopMelody(){melodyTimers.forEach(clearTimeout);melodyTimers=[];melodyOn=false;const gt=document.querySelector('.obj[data-id="gitar"]');if(gt)gt.classList.remove('playing');}
function playMelody(m){
  stopMelody();melodyOn=true;document.querySelector('.obj[data-id="gitar"]').classList.add('playing');
  const beat=60/m.bpm;let t=0;
  for(const [n,len,bass] of m.notes){
    const dl=t;
    if(n!=='-'){melodyTimers.push(setTimeout(()=>{tone({f:freqOf(n),d:Math.min(1.6,len*beat+.5),type:'triangle',g:.13});tone({f:freqOf(n)*2,d:.25,type:'sine',g:.03});},dl*1000));}
    if(bass){melodyTimers.push(setTimeout(()=>tone({f:freqOf(bass),d:Math.min(2.2,len*beat*2),type:'sine',g:.09}),dl*1000));}
    t+=len*beat;
  }
  melodyTimers.push(setTimeout(stopMelody,(t+1.5)*1000));
}
const ANIM={pintu:'knock',jendela:'flash',cermin:'wobble',gantungan:'swing',poster:'tilt',karpet:'tug',sampah:'lid',kipas:'pop',meja:'shake',lampu:'flicker',laptop:'flash',buku:'flip',kursi:'rock',rakdapur:'rattle',rakmakanan:'jitter',kasur:'sink',kucing:'bounce',gitar:'strum',lemari:'locked',asbak:'clink',jam:'tick',saklar:'cetek',stopkontak:'zap'};

    case 'saklar':document.body.classList.toggle('gelap');say(document.body.classList.contains('gelap')?'Room light off.':'Room light on.');break;
    case 'stopkontak':{const sk=el||document.querySelector('.obj[data-id="stopkontak"]');sk.classList.remove('zap');void sk.getBoundingClientRect();sk.classList.add('zap');setTimeout(()=>sk.classList.remove('zap'),600);say('The outlet. Laptop, fan and rice cooker take turns.');break;}
    case 'asbak':{const a=document.querySelector('.obj[data-id="asbak"]');a.classList.remove('puff');void a.getBoundingClientRect();a.classList.add('puff');setTimeout(()=>a.classList.remove('puff'),1800);say('Ashtray.');break;}
    case 'jam':{const n=new Date(),h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');
      const w=h<5?'Still up. Probably bug bounty.':h<11?'Morning.':h<15?'Midday, probably on campus.':h<19?'Late afternoon.':'Night. Work hours.';
      openPanel('jam');document.getElementById('jamNow').textContent=`It's ${h}:${m}. ${w}`;
      const tr=document.querySelector(`.jadwal tr[data-day="${n.getDay()}"]`);if(tr)tr.classList.add('today');say('Schedule is on the card. Today is highlighted.');break;}
  }
}
document.querySelectorAll('.obj').forEach(el=>{
  el.addEventListener('click',()=>act(el.dataset.id,el));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(el.dataset.id,el);}});
});
/* jam dinding: jarum mengikuti waktu asli */
function setClock(){
  const {xc,zc}=window._clock;const n=new Date();const ha=((n.getHours()%12)+n.getMinutes()/60)*Math.PI/6, ma=n.getMinutes()*Math.PI/30;
  const set=(id,a,L)=>{const q=P(xc-L*Math.sin(a),0.15,zc+L*Math.cos(a));const el=document.getElementById(id);el.setAttribute('x2',q[0].toFixed(1));el.setAttribute('y2',q[1].toFixed(1));};
  set('hh',ha,0.26);set('mh',ma,0.38);
}
setClock();setInterval(setClock,30000);
{const gg=document.querySelector('.obj[data-id="gantungan"]');gg.classList.add('jk');gg.dataset.view=0;}

document.querySelector('.mk[data-id="pintu"]').style.opacity=0;

idle();
