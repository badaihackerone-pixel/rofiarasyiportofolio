<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio // Rofi Arasyi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute;z-index:-1;">
        <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="paper-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" result="noise" />
            <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.96 0 0 0  0 0.92 0 0 0  0 0 0 0.3 0" in="noise" result="coloredNoise" />
            <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
        </filter>
    </svg>

    <div id="space-view" class="view active">
        <div class="nebula"></div>
        <div id="stars-layer-1" class="starfield twinkle-1"></div>
        <div id="stars-layer-2" class="starfield twinkle-2"></div>
        <div id="stars-layer-3" class="starfield twinkle-3"></div>
        
        <div class="shooting-star"></div>
        <div class="shooting-star" style="top: 25%; right: -10%; animation-delay: 5s;"></div>
        <div class="debris d1"></div><div class="debris d2"></div><div class="debris d3"></div>

        <div id="main-title-container">
            <div id="main-title">
                <h2 class="sub">Catatan Eksplorasi Sistem</h2>
                <h1>Portofolio Rofi Arasyi</h1>
            </div>
        </div>

        <div id="flight-guide">
            <h3>PANDUAN NAVIGASI</h3>
            <div class="keyboard-layout">
                <div class="key-row"><div class="key" id="key-w">W</div></div>
                <div class="key-row">
                    <div class="key" id="key-a">A</div>
                    <div class="key" id="key-s">S</div>
                    <div class="key" id="key-d">D</div>
                </div>
            </div>
            <p>Pilot, gunakan <strong>W, A, S, D</strong><br>Hampiri planet untuk mendarat.</p>
        </div>

        <div class="planet p-float-1" id="p-home" style="top: 22%; left: 15%;" data-id="page-home">
            <div class="orbit-ring"></div>
            <div class="crater c1"></div><div class="crater c2"></div>
            <div class="rose-container">
                <div class="glass-dome"></div>
                <div class="rose-flower"></div>
                <div class="rose-sparkle"></div>
            </div>
            <span class="label">Asteroid B-612</span>
            <div class="atmosphere-glow"></div>
        </div>
        
        <div class="planet p-float-2" id="p-bounty" style="top: 70%; left: 22%;" data-id="page-bounty">
            <div class="orbit-ring"></div>
            <div class="css-crown"></div>
            <span class="label">The King</span>
            <div class="atmosphere-glow"></div>
        </div>
        
        <div class="planet p-float-3" id="p-medfo" style="top: 25%; left: 78%;" data-id="page-medfo">
            <div class="orbit-ring"></div>
            <div class="css-lamp">
                <div class="lamp-head"></div>
                <div class="lamp-post"></div>
                <div class="lamp-light"></div>
            </div>
            <span class="label">Lamplighter</span>
            <div class="atmosphere-glow"></div>
        </div>

        <div class="planet p-float-1" id="p-contact" style="top: 75%; left: 72%;" data-id="page-contact">
            <div class="orbit-ring"></div>
            <div class="css-fox">
                <div class="fox-ear left"></div>
                <div class="fox-ear right"></div>
                <div class="fox-face"></div>
            </div>
            <span class="label">The Fox</span>
            <div class="atmosphere-glow"></div>
        </div>
    </div>

    <div id="surface-view" class="view">
        <div id="sky"></div>
        <div id="stars-surface" class="starfield" style="opacity: 0.25;"></div>
        
        <div id="clouds-container">
            <div class="cloud" style="top: 10%; width: 200px; height: 40px; animation-duration: 40s; opacity: 0.85;"></div>
            <div class="cloud" style="top: 28%; width: 280px; height: 55px; animation-duration: 55s; animation-delay: -20s; opacity: 0.55;"></div>
            <div class="cloud" style="top: 15%; width: 140px; height: 30px; animation-duration: 35s; animation-delay: -10s; opacity: 0.75;"></div>
            <div class="cloud" style="top: 42%; width: 220px; height: 45px; animation-duration: 60s; animation-delay: -30s; opacity: 0.45;"></div>
        </div>

        <div id="ground">
            <div class="dune d1"></div>
            <div class="dune d2"></div>
            <div class="dune d3"></div>
            <div class="rock r1"></div><div class="rock r2"></div>
        </div>
        
        <div id="surface-guide-top" class="surface-guide">
            <span class="nav-arrow">↑</span> TERBANG MENEMBUS LANGIT UNTUK KELUAR <span class="nav-arrow">↑</span>
        </div>
        
        <div id="surface-guide-bottom" class="surface-guide">
            <span class="nav-arrow">↓</span> TERBANG KE BAWAH UNTUK SCROLL <span class="nav-arrow">↓</span>
        </div>

        <div id="content-container"></div>
    </div>

    <div id="player">
        <div id="engine-exhaust"></div>
        <svg viewBox="0 0 100 100" width="75" height="75" style="position:relative; z-index:2; overflow:visible;">
            <g filter="drop-shadow(4px 12px 6px rgba(0,0,0,0.8))">
                <rect x="35" y="80" width="30" height="6" rx="3" fill="#e74c3c"/>
                <rect x="47" y="75" width="6" height="15" rx="2" fill="#c0392b"/>
                <path d="M 50 50 Q 65 70 55 95" stroke="#f1c40f" stroke-width="4" fill="none" class="scarf-wave"/>
                <rect x="20" y="45" width="60" height="8" rx="4" fill="#d35400"/>
                <path d="M 45 15 L 55 15 L 52 85 L 48 85 Z" fill="#e67e22"/>
                <rect x="10" y="30" width="80" height="10" rx="5" fill="#f1c40f"/>
                <line x1="25" y1="35" x2="25" y2="49" stroke="#333" stroke-width="3"/>
                <line x1="75" y1="35" x2="75" y2="49" stroke="#333" stroke-width="3"/>
                <circle cx="50" cy="45" r="8" fill="#2c3e50"/>
                <path d="M 42 45 Q 50 33 58 45" stroke="#ecf0f1" stroke-width="2.5" fill="none"/>
                <circle cx="50" cy="15" r="5" fill="#95a5a6"/>
                <g class="propeller">
                    <ellipse cx="50" cy="15" rx="38" ry="3" fill="#ecf0f1" opacity="0.85"/>
                </g>
            </g>
        </svg>
    </div>

    <template id="page-home">
        <div class="layout-split">
            <div class="text-content">
                <h1>Asteroid B-612</h1>
                <p class="quote">"Sesuatu yang penting tidak bisa dilihat oleh mata, melainkan oleh hati."</p>
                <div class="narrative-text">
                    <p>Saya adalah mahasiswa Teknik Elektro di Universitas Padjadjaran dengan minat utama pada teknologi informasi dan keamanan siber. Sebagai seorang bug hunter, saya menghabiskan waktu luang untuk menganalisis dan mengidentifikasi kerentanan keamanan pada berbagai platform digital. Selain aktivitas teknis, saya juga aktif berorganisasi di Himpunan Mahasiswa Teknik Elektro (HMTE) pada divisi Visual Komunikasi untuk merancang strategi konten digital himpunan.</p>
                </div>
                <div class="data-block">
                    <p><strong>Nama:</strong> Rofi Arasyi</p>
                    <p><strong>Tanggal Lahir:</strong> 8 Januari 2007</p>
                    <p><strong>Domisili:</strong> Cakung, Jakarta Timur</p>
                    <p><strong>Pendidikan:</strong> Teknik Elektro, FMIPA UNPAD</p>
                    <p><strong>NPM:</strong> 140910250067</p>
                </div>
            </div>
            <div class="photo-frame">
                <div class="photo-inner">
                    <img src="foto.jpeg" alt="Rofi Arasyi" onerror="this.style.display='none'">
                    <div class="css-photo-placeholder"></div>
                </div>
                <div class="photo-caption">Rofi Arasyi</div>
            </div>
        </div>
        <div style="height: 350px;"></div>
    </template>

    <template id="page-bounty">
        <h1>The King</h1>
        <div class="narrative-text">
            <p>Di luar kehidupan akademik, saya aktif melakukan praktik <em>Freelance Bug Bounty</em>. Sebagai peneliti keamanan independen (Bug Hunter), saya bertanggung jawab untuk menemukan, mengeksploitasi, dan melaporkan kerentanan kritis pada infrastruktur perusahaan berskala global sebelum celah tersebut dimanfaatkan oleh pihak yang tidak bertanggung jawab.</p>
        </div>
        <div class="grid-layout">
            <div class="data-block p-critical">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge red">P1</span>
                </div>
                <p class="bounty-reward">$3,000</p>
                <p class="status-text">Status: Unresolved</p>
            </div>
            <div class="data-block p-high">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge orange">P2</span>
                </div>
                <p class="bounty-reward">$1,200</p>
                <p class="status-text">Status: Resolved</p>
            </div>
            <div class="data-block p-medium">
                <div class="bounty-header">
                    <h3>Unity Technologies</h3>
                    <span class="badge yellow">P4</span>
                </div>
                <p class="bounty-reward">$150</p>
                <p class="status-text">Status: Unresolved</p>
            </div>
        </div>
        <div style="height: 350px;"></div>
    </template>

    <template id="page-medfo">
        <h1>Cahaya Pemantik</h1>
        <div class="narrative-text">
            <p>Saya juga aktif di Himpunan Mahasiswa Teknik Elektro (HMTE) sebagai Staf Departemen Media dan Informasi (Medfo) pada divisi Visual Komunikasi (Viskom). Tanggung jawab utama saya meliputi perancangan desain konten visual untuk media sosial seperti Instagram, manajemen aset digital, serta memastikan distribusi informasi kegiatan organisasi berjalan efektif dan konsisten.</p>
        </div>
        <div class="ig-gallery-grid">
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DXqywCLEk7b/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DW34wLymD07/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DWyXcHfmLI4/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
            <div class="ig-embed-wrapper">
                <iframe src="https://www.instagram.com/p/DV3Cp7Ckm78/embed" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            </div>
        </div>
        <div style="height: 400px;"></div>
    </template>

    <template id="page-contact">
        <h1>The Fox</h1>
        <p class="quote">"Kamu menjadi bertanggung jawab selamanya atas apa yang telah kamu jinakkan."</p>

                    </div>
                    <a href="https://instagram.com/rofiarasyi" target="_blank">@rofiarasyi</a>
                </li>
                <li>
                    <div class="svg-icon-wrap ln-color">
                        <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>

                    </div>
                    <a href="https://github.com/badaihackerone-pixel" target="_blank">badaihackerone-pixel</a>

                <li>
                    <div class="svg-icon-wrap bc-color">
                        <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><path d="M12 2C6.48 2 2 4.22 2 7v5c0 5.55 3.84 10.74 10 12 6.16-1.26 10-6.45 10-12V7c0-2.78-4.48-5-10-5zm0 16.5c-4.32-1.08-7.5-5.06-7.5-9.5V7.64C6.27 6.47 9.07 5.5 12 5.5s5.73.97 7.5 2.14V14c0 4.44-3.18 8.42-7.5 9.5zm-2-6h4v2h-4v-2zm0-5h4v4h-4V7.5z"/></svg>

        </div>
        <div style="height: 150px;"></div>
    </template>

    <script src="script.js"></script>
</body>
</html>
